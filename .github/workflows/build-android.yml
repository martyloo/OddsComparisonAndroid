name: Build Android APK and AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # -------------------------
      # BUILD DEBUG APK
      # -------------------------

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OddsCompare-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # -------------------------
      # CREATE SIGNING KEY
      # -------------------------

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/oddscompare-upload-key.jks"

      # -------------------------
      # BUILD SIGNED AAB
      # -------------------------

      - name: Build Signed Release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/oddscompare-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease

      # -------------------------
      # UPLOAD AAB
      # -------------------------

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: OddsCompare-AAB
          path: app/build/outputs/bundle/release/app-release.aab
