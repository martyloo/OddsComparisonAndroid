<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odds Compare - Mobile App Prototype</title>
<style>
    * { box-sizing: border-box; }
    :root {
        --blue: #0878f9;
        --blue-dark: #0567d9;
        --bg: #f3f5f8;
        --card: #ffffff;
        --text: #162033;
        --muted: #667085;
        --line: #e6e9ee;
        --green: #16a34a;
        --green-bg: #eaf8ef;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .app-shell {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
    }

    .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--blue);
        color: #fff;
        padding: 14px 16px 13px;
        box-shadow: 0 2px 8px rgba(0,0,0,.13);
    }

    .brand {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
    }

    .brand-title {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -.2px;
    }

    .brand-badge {
        font-size: 11px;
        padding: 5px 8px;
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 999px;
        background: rgba(255,255,255,.14);
    }

    .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
    }

    .search {
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 11px 12px;
        font-size: 14px;
        outline: none;
    }

    .format {
        border: 0;
        border-radius: 9px;
        padding: 0 10px;
        min-width: 98px;
        font-size: 13px;
        background: #fff;
        color: #222;
    }

    .content {
        padding: 12px;
    }

    .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 4px 2px 10px;
    }

    .section-title h1 {
        margin: 0;
        font-size: 18px;
    }

    .updated {
        color: var(--muted);
        font-size: 11px;
    }

    .loading, .empty, .error {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px 16px;
        text-align: center;
        color: var(--muted);
    }

    .fixture-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(22,32,51,.05);
    }

    .fixture-head {
        padding: 13px 14px 10px;
    }

    .date {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: .25px;
    }

    .teams {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
    }

    .team {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.2;
    }

    .team.away {
        text-align: right;
    }

    .team-with-logo {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
    }

    .team.away .team-with-logo {
        flex-direction: row-reverse;
    }

    .team-logo-slot {
        width: 28px;
        height: 28px;
        flex: 0 0 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .team-logo {
        width: 28px;
        height: 28px;
        object-fit: contain;
        display: block;
    }

    .team-logo.small,
    .team-logo-slot.small {
        width: 20px;
        height: 20px;
        flex-basis: 20px;
    }

    .team-badge-fallback {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #eef3f8;
        border: 1px solid #d8e0ea;
        color: #667085;
        font-size: 9px;
        line-height: 1;
        font-weight: 900;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
    }

    .team-logo-slot.small .team-badge-fallback {
        width: 20px;
        height: 20px;
        font-size: 7px;
    }

    .best-team-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        max-width: 100%;
    }

    .best-team-label .team-name-text {
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .vs {
        color: #98a2b3;
        font-size: 11px;
        font-weight: 700;
    }

    .best-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        padding: 0 10px 10px;
    }

    .best-grid.two-outcomes {
        grid-template-columns: repeat(2, 1fr);
    }

    .best-box {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 7px;
        text-align: center;
        background: #fafbfc;
        min-width: 0;
    }

    .best-label {
        font-size: 10px;
        color: var(--muted);
        font-weight: 700;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .best-odds {
        display: inline-block;
        min-width: 48px;
        padding: 7px 8px;
        border-radius: 8px;
        font-size: 17px;
        font-weight: 900;
        color: #0f7a35;
        background: var(--green-bg);
    }

    .best-bookmaker {
        margin-top: 6px;
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--blue);
        border-radius: 7px;
        padding: 3px 6px;
        overflow: hidden;
    }

    .best-bookmaker .bookmaker-logo {
        width: 70px;
        height: 27px;
        max-width: 100%;
    }

    .best-bookmaker-fallback {
        color: #fff;
        font-size: 9px;
        font-weight: 800;
        text-align: center;
        line-height: 1.1;
    }

    .compare-btn {
        width: 100%;
        border: 0;
        border-top: 1px solid var(--line);
        background: #fff;
        padding: 12px 14px;
        color: var(--blue);
        font-weight: 800;
        cursor: pointer;
        font-size: 13px;
    }

    .compare-btn:active {
        background: #f6f9ff;
    }

    .comparison {
        display: none;
        border-top: 1px solid var(--line);
        background: #fbfcfe;
        padding: 8px 10px 10px;
    }

    .comparison.open {
        display: block;
    }

    .compare-header, .bookmaker-row {
        display: grid;
        grid-template-columns: minmax(105px, 1.45fr) repeat(3, minmax(58px, .7fr));
        gap: 6px;
        align-items: center;
    }

    .compare-header.two-outcomes, .bookmaker-row.two-outcomes {
        grid-template-columns: minmax(105px, 1.45fr) repeat(2, minmax(72px, .8fr));
    }

    .compare-header {
        padding: 7px 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
    }

    .compare-header div:not(:first-child) {
        text-align: center;
    }

    .bookmaker-row {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 6px;
        margin-bottom: 6px;
    }

    .bookmaker-link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 42px;
        padding: 4px 7px;
        border-radius: 7px;
        background: var(--blue);
        text-decoration: none;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        overflow: hidden;
    }

    .bookmaker-logo {
        width: 82px;
        height: 30px;
        max-width: 100%;
        object-fit: contain;
        flex: 0 0 auto;
    }


    /* Per-bookmaker sizing for logos that are naturally small/wide. */
    .bookmaker-logo.logo-large {
        width: 96px;
        height: 34px;
    }

    .bookmaker-logo.logo-xlarge {
        width: 116px;
        height: 39px;
    }

    .bookmaker-logo.logo-xxlarge {
        width: 128px;
        height: 42px;
    }

    .best-bookmaker .bookmaker-logo.logo-large {
        width: 82px;
        height: 30px;
    }

    .best-bookmaker .bookmaker-logo.logo-xlarge {
        width: 100px;
        height: 35px;
    }

    .best-bookmaker .bookmaker-logo.logo-xxlarge {
        width: 108px;
        height: 38px;
    }

    .bookmaker-name {
        display: none;
    }

    .bookmaker-logo-fallback {
        display: block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .price {
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        padding: 6px 3px;
        border-radius: 7px;
        background: #f5f6f8;
    }

    .price.best {
        background: var(--green-bg);
        color: #0f7a35;
        outline: 1px solid #bde9ca;
    }

    .footer-space {
        height: 16px;
    }


    .sport-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 7px;
    }

    .sport-tabs .sport-tab {
        flex: 1 1 110px;
    }

    .sport-tab {
        min-width: 0;
        border: 1px solid rgba(255,255,255,.32);
        border-radius: 9px;
        padding: 10px 5px;
        background: rgba(255,255,255,.12);
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
    }

    .sport-tab.active {
        background: #fff;
        color: var(--blue);
        border-color: #fff;
    }

    .football-menu {
        display: none;
        margin-bottom: 10px;
    }

    .football-menu.open {
        display: block;
    }

    .football-menu .league-tabs {
        margin-bottom: 0;
    }

    .league-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
        padding: 4px;
        border-radius: 10px;
        background: rgba(255,255,255,.16);
        overflow: visible;
        align-items: stretch;
    }

    .league-tab {
        flex: 1 1 120px;
        border: 0;
        border-radius: 8px;
        padding: 8px 7px;
        background: transparent;
        color: rgba(255,255,255,.88);
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
    }

    .league-tab.active {
        background: #fff;
        color: var(--blue);
        box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }

    .tabs-loading {
        color: rgba(255,255,255,.9);
        font-size: 11px;
        padding: 8px 9px;
        white-space: nowrap;
    }

    .best-link {
        display: block;
        min-width: 0;
        color: inherit;
        text-decoration: none;
        border-radius: 10px;
    }

    .best-link:active .best-box {
        transform: scale(.98);
        background: #f4fbf6;
    }

    .best-link .best-box {
        height: 100%;
        transition: transform .08s ease, background .08s ease;
    }

    .best-link.available .best-box {
        cursor: pointer;
    }

    .best-link.available .best-odds::after {
        content: " ›";
        font-size: 14px;
    }

    .price-link {
        display: block;
        color: inherit;
        text-decoration: none;
        border-radius: 7px;
    }

    .price-link:active {
        transform: scale(.96);
    }

    .price-link .price {
        width: 100%;
    }

    .golf-card {
        background: #fff;
        border: 1px solid #e4e9f0;
        border-radius: 14px;
        margin-bottom: 10px;
        overflow: hidden;
    }

    .golf-card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 13px;
    }

    .golfer-name {
        min-width: 0;
        font-weight: 900;
        font-size: 15px;
        color: #172033;
    }

    .golf-best {
        flex: 0 0 auto;
        min-width: 82px;
        text-align: center;
        background: #e8f7ed;
        border: 1px solid #bfe7ca;
        border-radius: 10px;
        padding: 7px 8px;
        color: #146b31;
    }

    .golf-best-odds {
        font-size: 16px;
        font-weight: 900;
    }

    .golf-best-book {
        font-size: 9px;
        font-weight: 800;
        margin-top: 2px;
    }

    .golf-compare {
        display: none;
        border-top: 1px solid #edf0f4;
        padding: 8px 10px 10px;
    }

    .golf-compare.open {
        display: block;
    }

    .golf-book-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 90px;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #f0f2f5;
    }

    .golf-book-row:last-child {
        border-bottom: 0;
    }

    @media (min-width: 800px) {
        body {
            padding: 28px 0;
        }

        .app-shell {
            min-height: calc(100vh - 56px);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 14px 45px rgba(0,0,0,.15);
        }

        .topbar {
            position: relative;
        }

        .content {
            padding: 16px;
        }
    }

    @media (max-width: 390px) {
        .content { padding: 9px; }
        .fixture-head { padding: 12px 11px 9px; }
        .team-logo-slot, .team-logo, .team-badge-fallback {
            width: 24px;
            height: 24px;
        }
        .team-logo-slot { flex-basis: 24px; }
        .team-with-logo { gap: 5px; }
        .best-grid { gap: 5px; padding: 0 8px 9px; }
        .best-box { padding: 8px 4px; }
        .best-odds { font-size: 16px; min-width: 44px; }
        .compare-header, .bookmaker-row {
            grid-template-columns: minmax(92px, 1.25fr) repeat(3, minmax(50px, .65fr));
            gap: 4px;
        }
        .compare-header.two-outcomes, .bookmaker-row.two-outcomes {
            grid-template-columns: minmax(92px, 1.25fr) repeat(2, minmax(68px, .75fr));
        }
    }

    /* ---------------- ACCUMULATOR ---------------- */

    /* Accumulator cards now use the same fixture-card layout as league pages. */
    .accumulator-fixture {
        position: relative;
    }

    .accumulator-select {
        display: block;
        height: 100%;
        cursor: pointer;
        color: inherit;
        text-decoration: none;
    }

    .accumulator-select input[type="radio"] {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }

    .accumulator-select .best-box {
        height: 100%;
        transition: transform .08s ease, border-color .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .accumulator-select:active .best-box {
        transform: scale(.98);
    }

    .accumulator-select input[type="radio"]:checked + .best-box {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px rgba(0,123,255,.16);
        background: #f1f7ff;
    }

    .accumulator-selected-mark {
        display: none;
        margin-top: 5px;
        color: var(--blue);
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: .3px;
    }

    .accumulator-select input[type="radio"]:checked + .best-box .accumulator-selected-mark {
        display: block;
    }

    .accumulator-league-cards {
        margin-bottom: 18px;
    }

    .accumulator-league-cards h2 {
        margin: 4px 2px 8px;
        font-size: 16px;
        color: #172033;
    }

    .accumulator-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 10px;
    }

    .accumulator-help {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
    }

    .accumulator-calc {
        flex: 0 0 auto;
        border: 0;
        border-radius: 9px;
        background: var(--blue);
        color: #fff;
        padding: 10px 13px;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
    }

    .accumulator-league {
        margin: 0 0 16px;
    }

    .accumulator-league h2 {
        margin: 0 0 7px;
        font-size: 16px;
        color: #162033;
    }

    .accumulator-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        border: 1px solid #e4e9f0;
        border-radius: 12px;
    }

    .accumulator-table {
        width: max-content;
        min-width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        font-size: 11px;
    }

    .accumulator-table th,
    .accumulator-table td {
        border-right: 1px solid #e7ebf0;
        border-bottom: 1px solid #e7ebf0;
        min-width: 78px;
        width: 78px;
        height: 36px;
        padding: 5px 4px;
        text-align: center;
        background: #fff;
    }

    .accumulator-table th {
        height: 54px;
        background: var(--blue);
        color: #fff;
        vertical-align: middle;
    }

    .accumulator-table th:first-child,
    .accumulator-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 3;
        min-width: 155px;
        width: 155px;
        text-align: left;
    }

    .accumulator-table th:first-child {
        z-index: 5;
        padding-left: 9px;
    }

    .accumulator-table td:first-child {
        background: #f8fafc;
        padding: 7px 8px;
        font-weight: 800;
    }

    .accumulator-date-row td {
        position: static !important;
        width: auto !important;
        min-width: 0 !important;
        background: var(--blue-dark) !important;
        color: #fff;
        text-align: left !important;
        padding: 6px 9px !important;
        font-size: 10px;
        font-weight: 800;
    }

    .accumulator-table .bookmaker-link {
        min-height: 42px;
        height: 42px;
        width: 72px;
        margin: 0 auto;
        padding: 3px;
        background: transparent;
    }

    .accumulator-table .bookmaker-logo {
        width: 68px;
        height: 27px;
    }

    .accumulator-table .bookmaker-logo.logo-large {
        width: 74px;
        height: 30px;
    }

    .accumulator-table .bookmaker-logo.logo-xlarge,
    .accumulator-table .bookmaker-logo.logo-xxlarge {
        width: 76px;
        height: 32px;
    }

    .accumulator-table input[type="radio"] {
        margin: 0 5px 0 0;
        vertical-align: middle;
    }

    .accumulator-price.best {
        background: var(--green-bg);
        color: #0f7a35;
        font-weight: 900;
    }

    .accumulator-price.missing {
        color: #a0a7b2;
    }

    .accumulator-result {
        margin-top: 14px;
        background: #fff;
        border: 1px solid #dfe5ec;
        border-radius: 13px;
        overflow: hidden;
    }

    .accumulator-result-title {
        background: var(--blue);
        color: #fff;
        padding: 10px 12px;
        font-weight: 900;
        font-size: 14px;
    }

    .accumulator-result-body {
        padding: 10px;
    }

    .accumulator-selection {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 2px;
        border-bottom: 1px solid #edf0f4;
        font-size: 12px;
    }

    .accumulator-selection:last-child {
        border-bottom: 0;
    }

    .accumulator-best {
        margin-top: 12px;
        padding: 12px;
        border-radius: 11px;
        background: var(--blue);
        color: #fff;
        text-align: center;
    }

    .accumulator-best .bookmaker-link {
        width: 130px;
        min-height: 44px;
        margin: 8px auto 0;
    }

    .accumulator-best .bookmaker-logo {
        width: 118px;
        height: 38px;
    }

    .accumulator-total {
        margin-top: 6px;
        font-size: 20px;
        font-weight: 900;
    }

    .accumulator-no-common {
        margin-top: 10px;
        padding: 10px;
        border-radius: 9px;
        background: #fff4e5;
        color: #8a4b08;
        font-size: 12px;
        font-weight: 700;
    }

    @media (max-width: 390px) {
        .accumulator-table th:first-child,
        .accumulator-table td:first-child {
            min-width: 138px;
            width: 138px;
        }
        .accumulator-table th,
        .accumulator-table td {
            min-width: 74px;
            width: 74px;
        }
    }

</style>
</head>
<body>
<div class="app-shell">
    <div class="topbar">
        <div class="brand">
            <div class="brand-title">Odds Compare</div>
        </div>

        <div id="sport-tabs" class="sport-tabs" role="tablist" aria-label="Sports">
            <button id="sport-football" class="sport-tab active" type="button" onclick="selectSport('football')">
                Football <span id="football-arrow">▼</span>
            </button>
            <button id="sport-mma" class="sport-tab" type="button" onclick="selectSport('mma')">
                MMA
            </button>
            <button id="sport-boxing" class="sport-tab" type="button" onclick="selectSport('boxing')">
                Boxing
            </button>
            <button id="sport-tennis" class="sport-tab" type="button" onclick="selectSport('tennis')">
                Tennis <span id="tennis-arrow">▼</span>
            </button>
            <button id="sport-golf" class="sport-tab" type="button" onclick="selectSport('golf')">
                Golf <span id="golf-arrow">▼</span>
            </button>
            <button id="sport-cricket" class="sport-tab" type="button" onclick="selectSport('cricket')">
                Cricket <span id="cricket-arrow">▼</span>
            </button>
            <button id="sport-nba" class="sport-tab" type="button" onclick="selectSport('nba')">
                NBA <span id="nba-arrow">▼</span>

function gcd(a, b) {
    return b ? gcd(b, a % b) : Math.abs(a);
}

function toFractional(decimal) {
    const value = Number(decimal);
    if (!Number.isFinite(value) || value <= 1) {
        return Number.isFinite(value) ? value.toFixed(2) : '—';
    }

    const fractionalValue = value - 1;

    // Common UK bookmaker fractional prices.
    // The nearest conventional fraction is chosen instead of showing
    // literal hundredths such as 91/100 or 67/100.
    const commonFractions = [
        [1, 100], [1, 50], [1, 33], [1, 25], [1, 20], [1, 16], [1, 14],
        [1, 12], [1, 10], [1, 9], [1, 8], [1, 7], [1, 6], [2, 11],
        [1, 5], [2, 9], [1, 4], [2, 7], [3, 10], [1, 3], [4, 11],
        [2, 5], [4, 9], [1, 2], [8, 15], [4, 7], [8, 13], [2, 3], [8, 11], [4, 5], [5, 6], [10, 11], [1, 1],
        [11, 10], [6, 5], [5, 4], [13, 10], [11, 8], [7, 5], [3, 2], [8, 5], [13, 8], [7, 4], [15, 8], [2, 1], [9, 4],
        [5, 2], [11, 4], [3, 1], [10, 3], [7, 2], [4, 1], [9, 2],
        [5, 1], [11, 2], [6, 1], [13, 2], [7, 1], [15, 2], [8, 1],
        [9, 1], [10, 1], [11, 1], [12, 1], [14, 1], [16, 1], [18, 1],
        [20, 1], [22, 1], [25, 1], [28, 1], [33, 1], [40, 1], [50, 1],
        [66, 1], [80, 1], [100, 1]
    ];

    let bestNumerator = 1;
    let bestDenominator = 1;
    let smallestDifference = Infinity;

    for (const [numerator, denominator] of commonFractions) {
        const fraction = numerator / denominator;
        const difference = Math.abs(fractionalValue - fraction);

        if (difference < smallestDifference) {
            smallestDifference = difference;
            bestNumerator = numerator;
            bestDenominator = denominator;
        }
    }

    return `${bestNumerator}/${bestDenominator}`;
}

function formatOdds(value) {
    if (value == null || Number.isNaN(Number(value))) return '—';
    const decimal = Number(value);
    return document.getElementById('odds-format').value === 'fractional'
        ? toFractional(decimal)
        : decimal.toFixed(2);
}


// ---------------- FOOTBALL TEAM LOGOS ----------------
// Football badges are matched against a structured dataset scraped from
// football-logos.cc. The JSON contains the team name, country and the direct
// assets.football-logos.cc badge URL.
//
// Other sports deliberately do NOT use automatic logos yet.
// Source dataset: football-logos.cc badge URLs, mirrored as JSON on GitHub/jsDelivr.
const FOOTBALL_LOGO_DATA_URL =
    'https://cdn.jsdelivr.net/gh/hixcoder/football-teams-flags@main/football_teams.json';

const FOOTBALL_LOGO_OVERRIDES = {
    // Add any one-off corrections here if an API team name differs from the dataset.
    // Example:
    // 'man utd': 'https://assets.football-logos.cc/...png'
};

const FOOTBALL_NAME_ALIASES = {
    'man utd': 'manchester united',
    'man united': 'manchester united',
    'man city': 'manchester city',
    'wolves': 'wolverhampton wanderers',
    'spurs': 'tottenham',
    'newcastle united': 'newcastle',
    'brighton & hove albion': 'brighton',
    'brighton and hove albion': 'brighton',
    'west bromwich albion': 'west brom',
    'qpr': 'queens park rangers',
    'psg': 'paris saint-germain',
    'inter milan': 'inter',
    'internazionale': 'inter',
    'ac milan': 'milan',
    'athletic bilbao': 'athletic club',
    'atletico madrid': 'atletico madrid',
    'atlético madrid': 'atletico madrid',
    'sporting lisbon': 'sporting cp'
};

const FOOTBALL_LEAGUE_COUNTRY = {
    premier: 'England',
    championship: 'England',
    league1: 'England',
    league2: 'England',
    eflcup: 'England',
    facup: 'England',
    scottishpremier: 'Scotland',
    ireland: 'Republic of Ireland',
    laliga: 'Spain',
    laliga2: 'Spain',
    portugal: 'Portugal',
    france1: 'France',
    france2: 'France',
    seriea: 'Italy',
    serieb: 'Italy',
    mls: 'USA'
};

let FOOTBALL_LOGO_DATA = null;
let FOOTBALL_LOGO_DATA_PROMISE = null;
const FOOTBALL_RESOLVED_CACHE = {};

function teamSportHasLogos() {
    return currentSport === 'football';
}

function cleanFootballName(value) {
    return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/\b(fc|afc|cf|sc|calcio|football club|futbol club|fútbol club)\b/g, ' ')
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}

function footballAliasKey(team) {
    const raw = String(team || '').normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();

    return FOOTBALL_NAME_ALIASES[raw] || raw;
}

function currentFootballCountryHint() {
    return FOOTBALL_LEAGUE_COUNTRY[currentLeague] || '';
}

async function loadFootballLogoData() {
    if (FOOTBALL_LOGO_DATA) return FOOTBALL_LOGO_DATA;
    if (FOOTBALL_LOGO_DATA_PROMISE) return FOOTBALL_LOGO_DATA_PROMISE;

    FOOTBALL_LOGO_DATA_PROMISE = fetch(FOOTBALL_LOGO_DATA_URL, {
        cache: 'force-cache'
    })
        .then(response => {
            if (!response.ok) throw new Error(`Logo dataset HTTP ${response.status}`);
            return response.json();
        })
        .then(data => {
            FOOTBALL_LOGO_DATA = Array.isArray(data) ? data : [];
            return FOOTBALL_LOGO_DATA;
        })
        .catch(error => {
            console.warn('Could not load football badge dataset:', error);
            FOOTBALL_LOGO_DATA = [];
            return FOOTBALL_LOGO_DATA;
        });

    return FOOTBALL_LOGO_DATA_PROMISE;
}

function teamInitials(team) {
    const cleaned = String(team || '')
        .replace(/[^\p{L}\p{N}\s]/gu, ' ')
        .trim();

    if (!cleaned) return '?';

    const parts = cleaned.split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].slice(0, 3).toUpperCase();
    return parts.slice(0, 3).map(p => p[0]).join('').toUpperCase();
}

function teamLogoSlot(team, small=false) {
    if (!teamSportHasLogos()) return '';

    const encoded = encodeURIComponent(team);
    const initials = teamInitials(team);

    return `<span class="team-logo-slot${small ? ' small' : ''}" data-team-logo="${encoded}" aria-hidden="true"><span class="team-badge-fallback">${initials}</span></span>`;
}

function teamNameWithLogo(team, small=false) {
    if (!teamSportHasLogos()) return team;

    return `<span class="team-with-logo">${teamLogoSlot(team, small)}<span class="team-name-text">${team}</span></span>`;
}

function bestTeamLabel(label) {
    if (!teamSportHasLogos() || String(label).toLowerCase() === 'draw') return label;

    return `<span class="best-team-label">${teamLogoSlot(label, true)}<span class="team-name-text">${label}</span></span>`;
}

async function resolveFootballLogo(team) {
    if (currentSport !== 'football') return null;

    const cacheKey = `${currentLeague}|${team}`;
    if (Object.prototype.hasOwnProperty.call(FOOTBALL_RESOLVED_CACHE, cacheKey)) {
        return FOOTBALL_RESOLVED_CACHE[cacheKey];
    }

    const rawAlias = footballAliasKey(team);

    if (FOOTBALL_LOGO_OVERRIDES[rawAlias]) {
        FOOTBALL_RESOLVED_CACHE[cacheKey] = FOOTBALL_LOGO_OVERRIDES[rawAlias];
        return FOOTBALL_RESOLVED_CACHE[cacheKey];
    }

    const data = await loadFootballLogoData();
    if (!data.length) {
        FOOTBALL_RESOLVED_CACHE[cacheKey] = null;
        return null;
    }

    const wanted = cleanFootballName(rawAlias);
    const countryHint = currentFootballCountryHint();

    // 1) Exact normalized name, preferring the country implied by the selected league.
    let matches = data.filter(item =>
        cleanFootballName(item?.name) === wanted && item?.logoUrl
    );

    if (countryHint && matches.length > 1) {
        const sameCountry = matches.filter(item =>
            String(item?.country || '').toLowerCase() === countryHint.toLowerCase()
        );
        if (sameCountry.length) matches = sameCountry;
    }

    // 2) If no exact result, permit a cautious starts/contains match.
    // Only accept it when it resolves uniquely to avoid showing the wrong crest.
    if (!matches.length && wanted.length >= 5) {
        let fuzzy = data.filter(item => {
            if (!item?.logoUrl) return false;
            const candidate = cleanFootballName(item.name);
            return candidate === wanted ||
                   candidate.startsWith(wanted + ' ') ||
                   wanted.startsWith(candidate + ' ');
        });

        if (countryHint) {
            const sameCountry = fuzzy.filter(item =>
                String(item?.country || '').toLowerCase() === countryHint.toLowerCase()
            );
            if (sameCountry.length) fuzzy = sameCountry;
        }

        if (fuzzy.length === 1) matches = fuzzy;
    }

    const url = matches[0]?.logoUrl || null;
    FOOTBALL_RESOLVED_CACHE[cacheKey] = url;
    return url;
}

async function hydrateTeamLogos(events) {
    if (currentSport !== 'football') return;

    const teams = [...new Set(
        (events || []).flatMap(game => [game.home, game.away]).filter(Boolean)
    )];

    // Capture league/sport so a slow logo lookup cannot inject football badges
    // after the user has already switched to another sport.
    const sportAtStart = currentSport;
    const leagueAtStart = currentLeague;

    await Promise.allSettled(teams.map(async team => {
        const url = await resolveFootballLogo(team);
        if (!url) return;
        if (currentSport !== sportAtStart || currentLeague !== leagueAtStart) return;

        const encoded = encodeURIComponent(team);

        document.querySelectorAll(`[data-team-logo="${encoded}"]`).forEach(slot => {
            const isSmall = slot.classList.contains('small');
            const fallback = slot.innerHTML;

            const img = document.createElement('img');
            img.className = `team-logo${isSmall ? ' small' : ''}`;
            img.src = url;
            img.alt = `${team} logo`;
            img.loading = 'lazy';
            img.referrerPolicy = 'no-referrer';

            img.onerror = () => {
                slot.innerHTML = fallback;
            };

            slot.innerHTML = '';
            slot.appendChild(img);
        });
    }));
}

function normalizeData(data) {
    const games = new Map();

    data.forEach(odd => {
        const key = `${odd.home_team}__${odd.away_team}__${odd.commence_time}`;
        if (!games.has(key)) {
            games.set(key, {
                home: odd.home_team,
                away: odd.away_team,
                commence_time: odd.commence_time,
                bookmakers: {}
            });
        }

        const game = games.get(key);
        if (!game.bookmakers[odd.bookmaker]) {
            game.bookmakers[odd.bookmaker] = {};
        }

        let type = null;
        if (odd.outcome_name === odd.home_team) type = 'home';
        else if (odd.outcome_name === odd.away_team) type = 'away';
        else if ((odd.outcome_name || '').toLowerCase() === 'draw') type = 'draw';

        if (!type) return;

        const price = Number(odd.price);
        const current = game.bookmakers[odd.bookmaker][type];

        // If the API gives the same bookmaker/outcome more than once,
        // retain the highest available price.
        if (current == null || price > current) {
            game.bookmakers[odd.bookmaker][type] = price;
        }
    });

    return Array.from(games.values())
        .sort((a, b) => new Date(a.commence_time) - new Date(b.commence_time));
}

function futureOnly(games) {
    const now = Date.now();

    return games.filter(game => {
        const kickoff = new Date(game.commence_time).getTime();
        return Number.isFinite(kickoff) && kickoff > now;
    });
}

function bestFor(game, type) {
    let best = null;

    Object.entries(game.bookmakers).forEach(([bookmaker, prices]) => {
        const value = prices[type];
        if (value == null) return;
        if (!best || value > best.value) {
            best = { bookmaker, value };
        }
    });

    return best;
}

function prettyDate(value) {
    return new Date(value).toLocaleString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
    });
}


function bookmakerKey(name) {
    return String(name || '')
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]/g, '');
}

const BOOKMAKER_ALIASES = {
    betfred: 'Betfred',
    betfredsports: 'Betfred',
    betfreduk: 'Betfred',
    betfredunitedkingdom: 'Betfred',
    unibetuk: 'Unibet',
    unibetunitedkingdom: 'Unibet',
    virginbet: 'Virgin Bet',
    virginbetuk: 'Virgin Bet',
    betano: 'Betano',
    betanouk: 'Betano',
    unibet: 'Unibet',
    unibetsports: 'Unibet',
    leovegas: 'LeoVegas',
    leovegassport: 'LeoVegas',
    grosvenor: 'Grosvenor',
    grosvenorsport: 'Grosvenor',
    grosvenorsports: 'Grosvenor'
};

function bookmakerInfo(name) {
    if (BOOKMAKERS[name]) return BOOKMAKERS[name];

    const key = bookmakerKey(name);
    const alias = BOOKMAKER_ALIASES[key];
    if (alias && BOOKMAKERS[alias]) return BOOKMAKERS[alias];

    const exactKey = Object.keys(BOOKMAKERS).find(k => bookmakerKey(k) === key);
    return exactKey ? BOOKMAKERS[exactKey] : {};
}

function bookmakerCell(name) {
    const info = bookmakerInfo(name);
    const logo = info.logo
        ? `<img class="bookmaker-logo${info.logoClass ? ` ${info.logoClass}` : ``}" src="${info.logo}" alt="${name}" title="${name}">`
        : `<span class="bookmaker-logo-fallback">${name}</span>`;
    const url = info.url || '#';

    return `
        <a class="bookmaker-link" href="${url}" target="_blank" rel="noopener" aria-label="${name}" title="${name}">
            ${logo}
        </a>
    `;
}

function bestBookmakerLogo(best) {
    if (!best) return `<span class="best-bookmaker-fallback">No odds</span>`;
    const info = bookmakerInfo(best.bookmaker);
    return info.logo
        ? `<img class="bookmaker-logo${info.logoClass ? ` ${info.logoClass}` : ``}" src="${info.logo}" alt="${best.bookmaker}" title="${best.bookmaker}">`
        : `<span class="best-bookmaker-fallback">${best.bookmaker}</span>`;
}

function outcomeBox(label, best) {
    const info = best ? bookmakerInfo(best.bookmaker) : {};
    const url = info.url || '';

    if (!best || !url) {
        return `
            <div class="best-link">
                <div class="best-box">
                    <div class="best-label">${bestTeamLabel(label)}</div>
                    <div class="best-odds">${best ? formatOdds(best.value) : '—'}</div>
                    <div class="best-bookmaker">${bestBookmakerLogo(best)}</div>
                </div>
            </div>
        `;
    }

    return `
        <a class="best-link available"
           href="${url}"
           target="_blank"
           rel="noopener"
           aria-label="${label}: ${formatOdds(best.value)} at ${best.bookmaker}">
            <div class="best-box">
                <div class="best-label">${bestTeamLabel(label)}</div>
                <div class="best-odds">${formatOdds(best.value)}</div>
                <div class="best-bookmaker">${bestBookmakerLogo(best)}</div>
            </div>
        </a>
    `;
}

function renderFixtures() {
    const query = document.getElementById('search').value.trim().toLowerCase();
    const container = document.getElementById('fixtures');
    const events = futureOnly(allEvents).filter(game => game.home.toLowerCase().includes(query) || game.away.toLowerCase().includes(query) || prettyDate(game.commence_time).toLowerCase().includes(query));
    if (!events.length) { container.innerHTML = `<div class="empty">No matches found.</div>`; return; }
    container.innerHTML = events.map((game,index) => {
        const bestHome=bestFor(game,'home'), bestDraw=bestFor(game,'draw'), bestAway=bestFor(game,'away');
        const hasDrawOdds=Object.values(game.bookmakers).some(p=>p.draw!=null);
        const showDraw=currentSport==='football'||hasDrawOdds;
        const two=showDraw?'':' two-outcomes';
        const firstLabel=(currentSport==='football'||currentSport==='cricket'||currentSport==='nba'||currentSport==='nfl'||currentSport==='baseball'||currentSport==='hockey')?'Home':(currentSport==='tennis'?'Player 1':'Fighter 1');
        const secondLabel=(currentSport==='football'||currentSport==='cricket'||currentSport==='nba'||currentSport==='nfl'||currentSport==='baseball'||currentSport==='hockey')?'Away':(currentSport==='tennis'?'Player 2':'Fighter 2');
        const rows=Object.keys(game.bookmakers).sort((a,b)=>a.localeCompare(b)).map(name=>{
            const p=game.bookmakers[name], info=bookmakerInfo(name), url=info.url||'#';
            const cp=(v,b,o)=>v==null?`<div class="price">—</div>`:`<a class="price-link" href="${url}" target="_blank" rel="noopener" aria-label="${o} ${formatOdds(v)} at ${name}"><div class="price ${b?'best':''}">${formatOdds(v)}</div></a>`;
            return `<div class="bookmaker-row${two}">${bookmakerCell(name)}${cp(p.home,bestHome&&p.home===bestHome.value,firstLabel)}${showDraw?cp(p.draw,bestDraw&&p.draw===bestDraw.value,'Draw'):''}${cp(p.away,bestAway&&p.away===bestAway.value,secondLabel)}</div>`;
        }).join('');
        return `<article class="fixture-card"><div class="fixture-head"><div class="date">${prettyDate(game.commence_time)}</div><div class="teams"><div class="team">${teamNameWithLogo(game.home)}</div><div class="vs">VS</div><div class="team away">${teamNameWithLogo(game.away)}</div></div></div><div class="best-grid${two}">${outcomeBox(game.home,bestHome)}${showDraw?outcomeBox('Draw',bestDraw):''}${outcomeBox(game.away,bestAway)}</div><button class="compare-btn" onclick="toggleComparison(${index}, this)">Compare all bookmakers ▼</button><div id="compare-${index}" class="comparison"><div class="compare-header${two}"><div>Bookmaker</div><div>${firstLabel}</div>${showDraw?'<div>Draw</div>':''}<div>${secondLabel}</div></div>${rows}</div></article>`;
    }).join('');

    // Resolve logos only for the fixtures currently being displayed.
    // This keeps startup traffic low and the results are cached for later views.
    hydrateTeamLogos(events);
}

async function fetchCombatSport(sportKey) {
    const sport = COMBAT_SPORTS[sportKey];

    try {
        const response = await fetch(sport.api, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const futureEvents = futureOnly(normalizeData(data));

        sportCache[sportKey] = {
            games: futureEvents,
            available: futureEvents.length > 0,
            error: false
        };

        return sportCache[sportKey];
    } catch (error) {
        console.error(`Could not load ${sport.name}:`, error);

        sportCache[sportKey] = {
            games: [],
            available: false,
            error: true
        };

        return sportCache[sportKey];
    }
}

function renderGolfOdds() {
    const query = document.getElementById('search').value.trim().toLowerCase();
    const container = document.getElementById('fixtures');

    const golfers = {};
    golfOddsData.forEach(odd => {
        const golfer = String(odd.outcome_name || '').trim();
        const bookmaker = String(odd.bookmaker || '').trim();
        const price = Number(odd.price);
        if (!golfer || !bookmaker || !Number.isFinite(price)) return;

        if (!golfers[golfer]) golfers[golfer] = {};
        if (golfers[golfer][bookmaker] == null || price > golfers[golfer][bookmaker]) {
            golfers[golfer][bookmaker] = price;
        }
    });

    const entries = Object.entries(golfers)
        .filter(([golfer]) => golfer.toLowerCase().includes(query))
        .sort((a,b) => {
            const shortestA = Math.min(...Object.values(a[1]));
            const shortestB = Math.min(...Object.values(b[1]));
            return shortestA - shortestB;
        });

    if (!entries.length) {
        container.innerHTML = `<div class="empty">No golfers found.</div>`;
        return;
    }

    container.innerHTML = entries.map(([golfer, prices], index) => {
        const priceEntries = Object.entries(prices).sort((a,b)=>a[0].localeCompare(b[0]));
        const bestValue = Math.max(...priceEntries.map(([,v])=>v));
        const bestEntry = priceEntries.find(([,v])=>v===bestValue);
        const bestBook = bestEntry ? bestEntry[0] : '';
        const bestInfo = bookmakerInfo(bestBook);
        const bestUrl = bestInfo.url || '#';

        const rows = priceEntries.map(([bookmaker, price]) => {
            const info = bookmakerInfo(bookmaker);
            const url = info.url || '#';
            const isBest = price === bestValue;
            return `<div class="golf-book-row">
                ${bookmakerCell(bookmaker)}
                <a class="price-link" href="${url}" target="_blank" rel="noopener" aria-label="${golfer} ${formatOdds(price)} at ${bookmaker}">
                    <div class="price ${isBest?'best':''}">${formatOdds(price)}</div>
                </a>
            </div>`;
        }).join('');

        return `<article class="golf-card">
            <div class="golf-card-head">
                <div class="golfer-name">${golfer}</div>
                <a class="best-link available" href="${bestUrl}" target="_blank" rel="noopener">
                    <div class="golf-best">
                        <div class="golf-best-odds">${formatOdds(bestValue)}</div>
                        <div class="golf-best-book">${bestBook}</div>
                    </div>
                </a>
            </div>
            <button class="compare-btn" onclick="toggleGolfComparison(${index}, this)">Compare all bookmakers ▼</button>
            <div id="golf-compare-${index}" class="golf-compare">${rows}</div>
        </article>`;
    }).join('');
}

    document.getElementById('search').placeholder = 'Search golfer...';

function canonicalBookmakerName(name) {
    const key = bookmakerKey(name);
    const alias = BOOKMAKER_ALIASES[key];
    if (alias) return alias;
    const direct = Object.keys(BOOKMAKERS).find(k => bookmakerKey(k) === key);
    return direct || name;
}

function accumulatorBookmakerLogo(name) {
    const info = bookmakerInfo(name);
    if (!info.logo) return `<span class="bookmaker-logo-fallback">${name}</span>`;
    const url = info.url || '#';
    return `<a class="bookmaker-link" href="${url}" target="_blank" rel="noopener" aria-label="${name}" title="${name}">
        <img class="bookmaker-logo${info.logoClass ? ` ${info.logoClass}` : ''}" src="${info.logo}" alt="${name}">
    </a>`;
}

function accumulatorPriceFor(game, bookmaker, outcome) {
    let best = null;
    Object.entries(game.bookmakers || {}).forEach(([rawName, prices]) => {
        if (canonicalBookmakerName(rawName) !== bookmaker) return;
        const value = Number(prices?.[outcome]);
        if (Number.isFinite(value) && (best == null || value > best)) best = value;
    });
    return best;
}

function accumulatorGameId(leagueKey, game, index) {
    return `${leagueKey}|${game.home}|${game.away}|${game.commence_time}|${index}`;
}

function accumulatorBestFor(prices) {
    let best = null;
    Object.entries(prices || {}).forEach(([bookmaker, value]) => {
        if (!Number.isFinite(value)) return;
        if (!best || value > best.value) best = { bookmaker, value };
    });
    return best;
}

function accumulatorSelectionBox(gameId, rowId, label, best) {
    return `
        <label class="accumulator-select">
            <input type="radio"
                name="acc-${encodeURIComponent(gameId)}"
                value="${escapeHtml(rowId)}"
                data-accumulator-row="${escapeHtml(rowId)}">
            <div class="best-box">
                <div class="best-label">${bestTeamLabel(label)}</div>
                <div class="best-odds">${best ? formatOdds(best.value) : '—'}</div>
                <div class="best-bookmaker">${bestBookmakerLogo(best)}</div>
                <div class="accumulator-selected-mark">Selected ✓</div>
            </div>
        </label>`;
}

function accumulatorComparisonPrice(value, isBest, bookmaker, outcomeLabel) {
    if (!Number.isFinite(value)) return `<div class="price">—</div>`;
    const info = bookmakerInfo(bookmaker);
    const url = info.url || '#';
    return `<a class="price-link" href="${url}" target="_blank" rel="noopener"
        aria-label="${escapeHtml(outcomeLabel)} ${formatOdds(value)} at ${escapeHtml(bookmaker)}">
        <div class="price${isBest ? ' best' : ''}">${formatOdds(value)}</div>
    </a>`;
}

function accumulatorFixtureCard(leagueKey, game, index) {
    const gameId = accumulatorGameId(leagueKey, game, index);

    const outcomes = [
        { key: 'home', label: game.home },
        { key: 'draw', label: 'Draw' },
        { key: 'away', label: game.away }
    ];

    const outcomeData = {};

    outcomes.forEach(({key, label}) => {
        const rowId = `${gameId}|${key}`;
        const prices = {};

        ACCUMULATOR_BOOKMAKERS.forEach(bookmaker => {
            prices[bookmaker] = accumulatorPriceFor(game, bookmaker, key);
        });

        const best = accumulatorBestFor(prices);
        outcomeData[key] = { rowId, prices, best, label };

        accumulatorRows[rowId] = {
            leagueKey,
            leagueName: LEAGUES[leagueKey]?.name || leagueKey,
            home: game.home,
            away: game.away,
            commence_time: game.commence_time,
            label,
            outcome: key,
            prices
        };
    });

    const rows = ACCUMULATOR_BOOKMAKERS.map(bookmaker => {
        const home = outcomeData.home.prices[bookmaker];
        const draw = outcomeData.draw.prices[bookmaker];
        const away = outcomeData.away.prices[bookmaker];

        // Skip bookmakers that have no price for this match at all.
        if (![home, draw, away].some(Number.isFinite)) return '';

        return `<div class="bookmaker-row">
            ${bookmakerCell(bookmaker)}
            ${accumulatorComparisonPrice(home, home === outcomeData.home.best?.value, bookmaker, game.home)}
            ${accumulatorComparisonPrice(draw, draw === outcomeData.draw.best?.value, bookmaker, 'Draw')}
            ${accumulatorComparisonPrice(away, away === outcomeData.away.best?.value, bookmaker, game.away)}
        </div>`;
    }).join('');

    const compareId = `acc-compare-${leagueKey}-${index}`;

    return `<article class="fixture-card accumulator-fixture">
        <div class="fixture-head">
            <div class="date">${prettyDate(game.commence_time)}</div>
            <div class="teams">
                <div class="team">${teamNameWithLogo(game.home)}</div>
                <div class="vs">VS</div>
                <div class="team away">${teamNameWithLogo(game.away)}</div>
            </div>
        </div>

        <div class="best-grid">
            ${accumulatorSelectionBox(gameId, outcomeData.home.rowId, game.home, outcomeData.home.best)}
            ${accumulatorSelectionBox(gameId, outcomeData.draw.rowId, 'Draw', outcomeData.draw.best)}
            ${accumulatorSelectionBox(gameId, outcomeData.away.rowId, game.away, outcomeData.away.best)}
        </div>

        <button class="compare-btn" type="button"
            onclick="toggleAccumulatorComparison('${compareId}', this)">
            Compare all bookmakers ▼
        </button>

        <div id="${compareId}" class="comparison">
            <div class="compare-header">
                <div>Bookmaker</div>
                <div>Home</div>
                <div>Draw</div>
                <div>Away</div>
            </div>
            ${rows || '<div class="empty">No bookmaker comparison available for this match.</div>'}
        </div>
    </article>`;
}

function toggleAccumulatorComparison(id, button) {

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function renderAccumulator() {
    currentSport = 'football';
    currentLeague = 'accumulator';
    updateSportTabs();
    renderLeagueTabs();

    document.getElementById('league-heading').textContent = 'Accumulator';
    document.getElementById('updated').textContent = '';

    const query = document.getElementById('search').value.trim().toLowerCase();
    const container = document.getElementById('fixtures');

    const availableLeagueKeys = ACCUMULATOR_LEAGUE_ORDER.filter(key => {

    });

    if (!availableLeagueKeys.length) {

    }

    let body = `<div class="accumulator-toolbar">

        </div>

    availableLeagueKeys.forEach(leagueKey => {

                game.home.toLowerCase().includes(query) ||
                game.away.toLowerCase().includes(query) ||

        }

        if (!games.length) return;
        renderedLeagues++;
        logoGames.push(...games);

    });

        container.innerHTML = `<div class="empty">No accumulator matches found for that search.</div>`;
        return;
    }

    body += `<div id="accumulator-result"></div>`;
    container.innerHTML = body;

function calculateAccumulator() {
    const checked = [...document.querySelectorAll('input[data-accumulator-row]:checked')];
    const result = document.getElementById('accumulator-result');
    if (!result) return;

    if (!checked.length) {
        result.innerHTML = `<div class="accumulator-result"><div class="accumulator-result-body">Select at least one outcome first.</div></div>`;
        result.scrollIntoView({behavior:'smooth', block:'nearest'});
        return;
    }

    const selections = checked
        .map(input => accumulatorRows[input.dataset.accumulatorRow])
        .filter(Boolean);

    const combined = {};
    ACCUMULATOR_BOOKMAKERS.forEach(bookmaker => {
        let total = 1;
        let complete = true;
        selections.forEach(selection => {
            const price = selection.prices[bookmaker];
            if (!Number.isFinite(price)) complete = false;
            else total *= price;
        });
        if (complete) combined[bookmaker] = total;
    });

    const valid = Object.entries(combined).sort((a,b) => b[1] - a[1]);
    const best = valid[0] || null;

    const selectionHtml = selections.map(sel => `
        <div class="accumulator-selection">
            <span><strong>${escapeHtml(sel.label)}</strong><br><span style="color:#667085">${escapeHtml(sel.leagueName)} · ${escapeHtml(sel.home)} vs ${escapeHtml(sel.away)}</span></span>
        </div>`).join('');

    let bestHtml = '';
    if (best) {
        const [bookmaker, total] = best;
        bestHtml = `<div class="accumulator-best">
            <div>Best bookmaker for all ${selections.length} selections</div>
            ${accumulatorBookmakerLogo(bookmaker)}
            <div class="accumulator-total">${formatOdds(total)}</div>
        </div>`;
    } else {
        bestHtml = `<div class="accumulator-no-common">
            No single bookmaker currently has prices for every selected outcome. Try removing one selection or choosing matches with broader bookmaker coverage.
        </div>`;
    }

    result.innerHTML = `<div class="accumulator-result">
        <div class="accumulator-result-title">Your Accumulator</div>
        <div class="accumulator-result-body">${selectionHtml}${bestHtml}</div>
    </div>`;
    result.scrollIntoView({behavior:'smooth', block:'start'});
}

async function loadOdds(leagueKey = currentLeague) {
    const container = document.getElementById('fixtures');

    if (!leagueKey || !LEAGUES[leagueKey]) return;

    const league = LEAGUES[leagueKey];
    currentSport = 'football';
    currentLeague = leagueKey;
    updateSportTabs();

    document.getElementById('league-heading').textContent = league.name;
    container.innerHTML = `<div class="loading">Loading ${league.name} odds...</div>`;

    let result = leagueCache[leagueKey];

    // Re-check the selected competition so stale fixtures can disappear
    // once their kickoff time has passed.
    result = await fetchLeague(leagueKey);
    renderLeagueTabs();

    if (!result.available) {
        // The selected tab may have disappeared while refreshing.
        const nextKey = Object.keys(LEAGUES).find(key => leagueCache[key]?.available);

        if (nextKey && nextKey !== leagueKey) {
            await switchLeague(nextKey);
            return;
        }

        allEvents = [];
        container.innerHTML = `<div class="empty">No upcoming matches available.</div>`;
        document.getElementById('updated').textContent = '';
        return;
    }

    allEvents = futureOnly(result.games);
    renderFixtures();

    document.getElementById('updated').textContent =
        `Updated ${new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})}`;
}

async function switchLeague(leagueKey) {
    if (leagueKey === 'accumulator') {
        currentSport = 'football';
        currentLeague = 'accumulator';
        allEvents = [];
        document.getElementById('search').value = '';
        document.getElementById('updated').textContent = '';
        renderAccumulator();
        closeSportDropdown('football');
        return;
    }

    if (!LEAGUES[leagueKey]) return;

    currentSport = 'football';
    currentLeague = leagueKey;
    allEvents = [];
    document.getElementById('search').value = '';
    document.getElementById('updated').textContent = '';
    document.getElementById('league-heading').textContent = LEAGUES[leagueKey].name;

    updateSportTabs();
    renderLeagueTabs();
    await loadOdds(leagueKey);
    closeSportDropdown('football');
}

async function initialiseApp(){
    const container=document.getElementById('fixtures');container.innerHTML='<div class="loading">Checking upcoming events...</div>';
    await Promise.all([...Object.keys(LEAGUES).map(k=>fetchLeague(k)),...Object.keys(TENNIS).map(k=>fetchTennis(k)),...Object.keys(GOLF).map(k=>fetchGolf(k)),...Object.keys(CRICKET).map(k=>fetchCricket(k)),...Object.keys(NBA_COMPETITIONS).map(k=>fetchNBACompetition(k)),...Object.keys(NFL_COMPETITIONS).map(k=>fetchNFLCompetition(k)),fetchBaseball(),...Object.keys(HOCKEY).map(k=>fetchHockey(k)),fetchCombatSport('mma'),fetchCombatSport('boxing')]);
    const football=Object.keys(LEAGUES).filter(k=>leagueCache[k]?.available),tennis=Object.keys(TENNIS).filter(k=>tennisCache[k]?.available),golf=Object.keys(GOLF).filter(k=>golfCache[k]?.available),cricket=Object.keys(CRICKET).filter(k=>cricketCache[k]?.available),nba=Object.keys(NBA_COMPETITIONS).filter(k=>nbaCache[k]?.available),nfl=Object.keys(NFL_COMPETITIONS).filter(k=>nflCache[k]?.available);currentSport='football';currentTennis=tennis[0]||null;currentGolf=golf[0]||null;currentCricket=cricket[0]||null;currentNBA=nba.includes('nba')?'nba':(nba[0]||null);currentNFL=nfl.includes('nfl')?'nfl':(nfl[0]||null);renderTennisTabs();renderGolfTabs();renderCricketTabs();renderNBATabs();renderNFLTabs();
    document.getElementById('sport-baseball').style.display=baseballCache.mlb?.available?'':'none';
    const hockey=Object.keys(HOCKEY).filter(k=>hockeyCache[k]?.available);
    currentHockey=hockey.includes('nhl')?'nhl':(hockey[0]||null);
    renderHockeyTabs();
    updateSportTabs();
    if(!football.length){currentLeague=null;renderLeagueTabs();document.getElementById('league-heading').textContent='Football';container.innerHTML='<div class="empty">No upcoming football matches available.</div>';document.getElementById('updated').textContent='';return;}
    currentLeague=football.includes('premier')?'premier':football[0];renderLeagueTabs();renderTennisTabs();document.getElementById('league-heading').textContent=LEAGUES[currentLeague].name;allEvents=futureOnly(leagueCache[currentLeague].games);renderFixtures();document.getElementById('updated').textContent=`Updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
}

document.getElementById('search').addEventListener('input', () => {
    if (currentSport === 'football' && currentLeague === 'accumulator') renderAccumulator();
    else if (currentSport === 'golf') renderGolfOdds();
    else renderFixtures();
});
document.getElementById('odds-format').addEventListener('change', () => {
    if (currentSport === 'football' && currentLeague === 'accumulator') renderAccumulator();
    else if (currentSport === 'golf') renderGolfOdds();
    else renderFixtures();
});

initialiseApp();
</script>
</body>
</html>
